# Weekly Portfolio Digest — Sunday 12:00 PM IST (6:30 AM UTC)
name: Weekly Digest

on:
  schedule:
    - cron: '30 6 * * 0'     # 6:30 AM UTC = 12:00 PM IST, Sunday
  workflow_dispatch:

jobs:
  weekly-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly digest
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python weekly_digest.py
