# FII/DII Activity Tracker — Sunday 3:00 PM IST (9:30 AM UTC)
name: FII DII Tracker

on:
  schedule:
    - cron: '30 9 * * 0'     # 9:30 AM UTC = 3:00 PM IST, Sunday
  workflow_dispatch:

jobs:
  fii-dii:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run FII/DII tracker
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python fii_dii_tracker.py
