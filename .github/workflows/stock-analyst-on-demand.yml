name: Stock Analyst On Demand

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: stock-analyst-on-demand
  cancel-in-progress: false

jobs:
  stock-analyst-on-demand:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      TZ: Asia/Kolkata
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Process pending stock commands
        run: python stock_analyst_bot.py --once